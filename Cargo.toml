[package]
name = "mogick-provider"
version = "0.1.0"
edition = "2021"
authors = ["mogick-provider contributors"]
description = "Multi-account OAuth gateway for OpenAI and Anthropic compatible APIs"
license = "MIT"

[[bin]]
name = "mogick-provider"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1", features = ["full"] }

# Async runtime + HTTP client
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "http2"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.52", default-features = false }

# CLI / errors / time
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
ulid = "1"
rand = "0.9"
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
